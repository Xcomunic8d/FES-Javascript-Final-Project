        <h2 class="f1Titles">Schedule</h2>
        <div class="next-race__card">
            <div><h2 class="next-race__title">Next F1 Grand Prix Race</h2>
                <div id="race-info">Loading...</div>

                <script>
                    async function loadNextRace() {
                    try {
                        const res = await fetch('https://f1api.dev/api/current/next');
                        const data = await res.json();

                        const race = data.race[0];

                        const raceDate = race.schedule.race.date;
                        const raceTime = race.schedule.race.time;

                        // Combine date + time (if time exists)
                        let dateObj;
                        if (raceTime) {
                        dateObj = new Date(`${raceDate}T${raceTime}`);
                        } else {
                        dateObj = new Date(raceDate);
                        }

                        // Format nicely
                        const formatted = dateObj.toLocaleString(undefined, {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: raceTime ? '2-digit' : undefined,
                        minute: raceTime ? '2-digit' : undefined,
                        });

                        document.getElementById('race-info').innerHTML = `
                        <strong>${race.raceName || "Next Race"}</strong><br>
                        ${formatted}
                        `;

                    } catch (err) {
                        console.error(err);
                        document.getElementById('race-info').textContent = 'Failed to load race data.';
                    }
                    }

                    loadNextRace();
                </script>
            </div>
        </div>

        <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #ddd;

<body>

<table id="standings">
  <thead>
    <tr>
      <th>Standing</th>
      <th>Driver</th>
      <th>Team</th>
      <th>Points</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function loadStandings() {
  try {
    const res = await fetch('https://f1api.dev/api/current/drivers-championship');
    const data = await res.json();

    const tbody = document.querySelector('#standings tbody');

    // Sort by position (ascending)
    const sorted = data.drivers_championship.sort((a, b) => a.position - b.position);

    sorted.forEach(driver => {
      const row = document.createElement('tr');

      row.innerHTML = `
        <td>${driver.position}</td>
        <td>${driver.driver.name} ${driver.driver.surname}</td>
        <td>${driver.team.teamName}</td>
        <td>${driver.points}</td>
      `;

      tbody.appendChild(row);
    });

  } catch (err) {
    console.error('Error fetching data:', err);
  }
}

loadStandings();
</script>

           <table id="constructors">
  <thead>
    <tr>
      <th>Standing</th>
      <th>Team</th>
      <th>Points</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function loadConstructors() {
  try {
    const response = await fetch('https://f1api.dev/api/current/constructors-championship');
    const data = await response.json();

    const tbody = document.querySelector('#constructors tbody');
    tbody.innerHTML = '';

    // Ensure numerical vertical order (1 → last)
    const sorted = data.constructors_championship.sort(
      (a, b) => a.position - b.position
    );

    sorted.forEach(team => {
      const row = document.createElement('tr');

      row.innerHTML = `
        <td>${team.position}</td>
        <td>${team.team.teamName}</td>
        <td>${team.points}</td>
      `;

      tbody.appendChild(row);
    });

  } catch (error) {
    console.error('Error loading data:', error);
  }
}

// Load on page start
loadConstructors();
</script>
